[package]
name = "zrc_visitor"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zrc_utils = { path = "../zrc_utils" }
zrc_parser = { path = "../zrc_parser", optional = true }
zrc_typeck = { path = "../zrc_typeck", optional = true }

[features]
default = ["ast", "tast"]
ast = ["zrc_parser"]
tast = ["zrc_typeck"]
